<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — DonatKu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">🍩</div>
    <h1 class="auth-title">Daftar DonatKu</h1>
    <p class="auth-subtitle">Buat akun untuk mulai pesan donat</p>

    <div id="errorBox" class="form-error hidden"></div>

    <form id="registerForm">
      <div class="form-group">
        <label>Nama Akun (unik) *</label>
        <input type="text" class="input" id="username" placeholder="Contoh: jowen" autocomplete="username" required>
        <div class="form-hint">Nama ini tidak bisa diubah dan harus unik. Tanpa spasi.</div>
      </div>

      <div class="form-group">
        <label>Nama Lengkap *</label>
        <input type="text" class="input" id="fullName" placeholder="Contoh: Jowen Pratama" required>
      </div>

      <div class="form-group">
        <label>Kelas *</label>
        <select class="select" id="className" required>
          <!-- Diisi oleh JavaScript -->
        </select>
      </div>

      <div class="form-group">
        <label>Nomor HP *</label>
        <input type="tel" class="input" id="phone" placeholder="08xxxxxxxxxx" inputmode="numeric" required>
      </div>

      <div class="form-group">
        <label>Password *</label>
        <input type="password" class="input" id="password" placeholder="Minimal 6 karakter" minlength="6" required>
      </div>

      <div class="form-group">
        <label>Konfirmasi Password *</label>
        <input type="password" class="input" id="password2" placeholder="Ulangi password" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
        Daftar Sekarang
      </button>
    </form>

    <div class="auth-footer">
      Sudah punya akun? <a href="login.html">Masuk di sini</a>
    </div>
  </div>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Shared -->
<script src="../shared/supabase.js"></script>
<script src="../shared/utils.js"></script>
<script src="../shared/api.js"></script>

<script>
(function() {
  // Isi dropdown kelas
  document.getElementById('className').innerHTML = U.buildClassOptions();

  const form = document.getElementById('registerForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function hideError() {
    errorBox.classList.add('hidden');
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    hideError();

    const username = document.getElementById('username').value.trim().toLowerCase();
    const fullName = document.getElementById('fullName').value.trim();
    const className = document.getElementById('className').value;
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    // Validasi
    if (!username || username.length < 3) {
      showError('Nama akun minimal 3 karakter.'); return;
    }
    if (!/^[a-z0-9_]+$/.test(username)) {
      showError('Nama akun hanya boleh huruf kecil, angka, dan underscore (_).'); return;
    }
    if (!fullName) { showError('Nama lengkap wajib diisi.'); return; }
    if (!className) { showError('Kelas wajib dipilih.'); return; }
    if (!phone || phone.length < 10) { showError('Nomor HP tidak valid.'); return; }
    if (!/^[0-9]+$/.test(phone)) { showError('Nomor HP hanya boleh angka.'); return; }
    if (password.length < 6) { showError('Password minimal 6 karakter.'); return; }
    if (password !== password2) { showError('Password dan konfirmasi tidak sama.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Mendaftarkan...';

    try {
      // Cek username unik dulu (case-insensitive)
      const sb = getSupabase();
      const { data: existing } = await sb
        .from('profiles')
        .select('id')
        .eq('username_lower', username)
        .maybeSingle();

      if (existing) {
        throw new Error('Nama akun ini sudah digunakan. Coba nama lain.');
      }

      // Register
      await Auth.register({
        username: username,
        fullName: fullName,
        className: className,
        phone: phone,
        password: password
      });

      // Auto-login setelah register
      await Auth.login({ username: username, password: password });

      UI.toast('✓ Pendaftaran berhasil!', 'success');
      setTimeout(function() {
        window.location.href = 'index.html';
      }, 800);

    } catch (err) {
      showError(err.message || 'Gagal mendaftar. Coba lagi.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Daftar Sekarang';
    }
  });
})();
</script>
</body>
</html>
