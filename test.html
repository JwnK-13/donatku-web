<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test Supabase</title></head>
<body>
<h1>Test Koneksi Supabase</h1>
<div id="out">Loading...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/supabase.js"></script>
<script src="shared/utils.js"></script>
<script src="shared/api.js"></script>
<script>
(async function() {
  const out = document.getElementById('out');
  try {
    out.textContent = 'Mengambil data toppings...';
    const toppings = await API.getToppings();
    out.innerHTML = '<p style="color:green;">✅ BERHASIL!</p>' +
      '<p>Jumlah topping: <b>' + toppings.length + '</b></p>' +
      '<ul>' + toppings.map(t => '<li>' + t.name + ' — ' + U.rupiah(t.base_price) + '</li>').join('') + '</ul>';

    const crumbles = await API.getCrumbles();
    out.innerHTML += '<p>Jumlah crumble: <b>' + crumbles.length + '</b></p>';

    const settings = await API.getSettings();
    out.innerHTML += '<p>Nama toko: <b>' + settings.store_name + '</b></p>';
  } catch (e) {
    out.innerHTML = '<p style="color:red;">❌ ERROR: ' + e.message + '</p>';
  }
})();
</script>
</body>
</html>
