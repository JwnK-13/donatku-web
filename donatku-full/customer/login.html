<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — DonatKu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">🍩</div>
    <h1 class="auth-title">Masuk DonatKu</h1>
    <p class="auth-subtitle">Selamat datang kembali!</p>

    <div id="errorBox" class="form-error hidden"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Nama Akun</label>
        <input type="text" class="input" id="username" placeholder="Nama akun kamu" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" class="input" id="password" placeholder="Password kamu" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
        Masuk
      </button>
    </form>

    <div class="auth-footer">
      Belum punya akun? <a href="register.html">Daftar di sini</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase.js"></script>
<script src="../shared/utils.js"></script>
<script src="../shared/api.js"></script>

<script>
(function() {
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  // Redirect target (dari ?redirect=...)
  const params = new URLSearchParams(window.location.search);
  const redirectTo = params.get('redirect') || 'index.html';

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove('hidden');
  }
  function hideError() {
    errorBox.classList.add('hidden');
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    hideError();

    const username = document.getElementById('username').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      showError('Isi nama akun dan password.'); return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Masuk...';

    try {
      await Auth.login({ username: username, password: password });

      UI.toast('✓ Berhasil masuk!', 'success');
      setTimeout(function() {
        window.location.href = redirectTo;
      }, 600);
    } catch (err) {
      showError(err.message || 'Gagal masuk. Coba lagi.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Masuk';
    }
  });
})();
</script>
</body>
</html>
